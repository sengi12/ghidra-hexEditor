# Compile check for a Ghidra *script* plugin.
#
# There is no gradle build here on purpose: this is not a Ghidra extension and
# there is no standalone app to package. Ghidra's Script Manager compiles the
# entry script and the sibling resources/ package straight from this checkout
# the first time the script is run. The closest thing to a build is therefore
# what Ghidra itself does - javac the same files against a real Ghidra release's
# jars - so that is what runs below, once per supported Ghidra version. Both
# versions need JDK 21.
name: build

on:
  push:
    branches: [master]
  pull_request:
  # The Run-workflow button, so a branch can be checked without merging it.
  workflow_dispatch:

jobs:
  compile:
    name: ghidra ${{ matrix.ghidra }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - ghidra: 11.3.2
            zip: ghidra_11.3.2_PUBLIC_20250415.zip
          - ghidra: 12.1.3
            zip: ghidra_12.1.3_PUBLIC_20260817.zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }

      # The release zip is several hundred MB, so it is cached between runs and
      # only downloaded when the cache has no copy.
      - uses: actions/cache@v4
        id: ghidra
        with:
          path: ${{ runner.temp }}/ghidra/${{ matrix.zip }}
          key: ${{ matrix.zip }}
      - if: steps.ghidra.outputs.cache-hit != 'true'
        name: download ghidra ${{ matrix.ghidra }}
        run: |
          mkdir -p "$RUNNER_TEMP/ghidra"
          curl -fsSL -o "$RUNNER_TEMP/ghidra/${{ matrix.zip }}" \
            "https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_${{ matrix.ghidra }}_build/${{ matrix.zip }}"

      # Only the jars are needed for the classpath; the rest of the release
      # (docs, processors, native binaries) stays in the zip.
      - name: unzip
        run: unzip -q "$RUNNER_TEMP/ghidra/${{ matrix.zip }}" 'ghidra_*/Ghidra/*.jar' -d "$RUNNER_TEMP/ghidra"

      - name: javac
        run: |
          CP=$(find "$RUNNER_TEMP"/ghidra/ghidra_*/Ghidra -name '*.jar' | tr '\n' ':')
          javac -encoding UTF-8 -Xlint:deprecation -d out -cp "$CP" HexEditor.java resources/*.java
